# EffectCraft 的 OTools 插件 native 适配层。
#
# 上游 `crates/automation` 已经是 GUI-free 的（只依赖 engine / serde_json / thiserror / image），
# 并直接给出三件我们需要的东西：
#   - `tools::catalogue()` / `tools::available(bridge)` —— 工具目录（ToolDef）
#   - `ToolDef::descriptor()` —— 带 title / annotations 的 MCP Tool 对象
#   - `Backend::headless(Session)` + `tools::run(&mut Backend, name, args)` —— 执行
# 因此本 crate 只做契约转换，业务逻辑一行不重写。
#
# 独立 workspace：上游 workspace 是 wasm/GUI 导向，并进来会把 UI 依赖带进插件构建。
[package]
name = "otools-effectcraft-native"
description = "EffectCraft as an OTools plugin: headless MCP backend over the upstream effectcraft-automation crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_effectcraft_native"

[dependencies]
effectcraft-automation = { path = "../upstream/crates/automation" }
effectcraft-engine = { path = "../upstream/crates/engine" }
effectcraft-host = { path = "../upstream/crates/host" }
serde_json = "1"

# 上游 workspace 里的 `[patch.crates-io]` **不会**跟着 path 依赖带过来：补丁只在
# 发起构建的那个 workspace 根节点生效。craft-pdf 依赖打过补丁的 hayro-syntax
# （`DecodeLimits`），少了这一段会退回 crates.io 的未打补丁版本。
# 上游更新后要同步这里。
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.3.0" }

# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀。
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
